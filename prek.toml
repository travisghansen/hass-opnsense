# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "trailing-whitespace"
exclude = ".*\\.md$"

[[repos.hooks]]
id = "end-of-file-fixer"
exclude = ".*\\.md$"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-added-large-files"
exclude = "^uv\\.lock$"

[[repos]]
repo = "https://github.com/kjanat/actionlint"
rev = "v1.17"

[[repos.hooks]]
id = "actionlint-shellcheck"

[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.3"

[[repos.hooks]]
id = "codespell"

[[repos]]
repo = "https://github.com/streetsidesoftware/cspell-cli"
rev = "v10.4.1"

[[repos.hooks]]
id = "cspell"
files = "(?:\\.md$|custom_components/opnsense/translations/(?:en|fr)\\.json$)"
exclude = "^(?:CHANGELOG\\.md|docs/granular_permissions\\.md)$"
additional_dependencies = [
  "@cspell/dict-fr-fr@2.3.2"
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "mypy"
name = "mypy"
language = "system"
# Keep the uv hooks unlocked so a local `prek run -a` can create `.venv`
# and refresh a missing or stale lockfile. CI sets `UV_LOCKED=1` externally.
entry = "uv run --group dev mypy --config-file=pyproject.toml"
types = ["python"]
require_serial = true

# Run from the project environment: pydoclint parses the code, so it needs the
# project's Python, and prek does not apply `requires-python` to hook environments.
[[repos.hooks]]
id = "pydoclint"
name = "pydoclint"
language = "system"
entry = "uv run --group dev pydoclint"
types = ["python"]
require_serial = true

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.5"

[[repos.hooks]]
id = "ruff-check"
args = ["--fix"]

[[repos.hooks]]
id = "ruff-format"
