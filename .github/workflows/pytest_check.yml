name: pytest check and post coverage

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    # Keep the current leg's name: Dependabot auto-merge requires this check name.
    name: ${{ matrix.name }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login == 'prek-autoupdate-bot' ||
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      startsWith(github.event.pull_request.head.ref, 'release-please--') ||
      !(contains(github.event.pull_request.labels.*.name, 'dependencies') ||
      github.event.pull_request.user.type == 'Bot')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current Home Assistant from uv.lock with pytest-homeassistant. Posts coverage.
          - name: pytest check and post coverage
            ha-version: current
            test-plugin: ""
          # Minimum supported Home Assistant. pytest-homeassistant starts at 2026.11, so
          # use its predecessor; 0.13.317 pins homeassistant==2026.3.1, the oldest 2026.3
          # release it covers.
          - name: pytest Home Assistant 2026.3.1 (minimum)
            ha-version: "2026.3.1"
            test-plugin: pytest-homeassistant-custom-component==0.13.317

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup uv (with caching)
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          ignore-nothing-to-cache: true
          cache-dependency-glob: uv.lock

      - name: Run pytest with coverage from the lock
        if: matrix.ha-version == 'current'
        run: uv run --locked --group pytest pytest

      - name: Install minimum Home Assistant test environment
        if: matrix.ha-version != 'current'
        # --no-config skips the project's [tool.uv] security constraints, which
        # conflict with the older dependency pins of the minimum HA release. This
        # environment is only used for tests.
        run: |
          uv venv
          uv pip install --no-config --group pytest-base "${TEST_PLUGIN}"
        env:
          TEST_PLUGIN: ${{ matrix.test-plugin }}

      - name: Verify minimum Home Assistant version
        if: matrix.ha-version != 'current'
        run: >-
          .venv/bin/python -c "import sys; from homeassistant.const import __version__;
          print(f'Home Assistant {__version__}');
          sys.exit(__version__ != sys.argv[1])" "${HA_VERSION}"
        env:
          HA_VERSION: ${{ matrix.ha-version }}

      - name: Run pytest on minimum Home Assistant
        if: matrix.ha-version != 'current'
        run: .venv/bin/python -m pytest

      - name: Generate coverage comment
        # Keep required tests running for update and release PRs without posting coverage.
        if: >-
          matrix.ha-version == 'current' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'prek-autoupdate-bot' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !startsWith(github.event.pull_request.head.ref, 'release-please--')
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v4.6
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIVITY: process_pr
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70

      - name: Store PR coverage comment
        if: steps.coverage_comment.outputs.comment_file_written == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
          retention-days: 1

      - name: Store coverage data for trusted publication
        if: matrix.ha-version == 'current' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-data
          path: .coverage
          include-hidden-files: true
          retention-days: 1
