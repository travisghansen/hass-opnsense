name: HA and HACS Validate

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  ha_validation:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Hassfest validation
        # Keep our aiopnsense pin independent of the built-in OPNsense integration.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/github/workspace" \
            ghcr.io/home-assistant/hassfest \
            --skip-plugins requirements
  hacs_validation:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
