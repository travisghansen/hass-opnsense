name: Release

run-name: Release ${{ inputs.tag || inputs.bump }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Stable version bump when tag is blank
        required: true
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      tag:
        description: Release tag (for example, v1.0.6 or v1.1.0-beta.1)
        required: false
        default: ""
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "Release workflow must be dispatched from $DEFAULT_BRANCH," >&2
            echo "not $RELEASE_REF." >&2
            exit 1
          fi

      - name: Checkout selected revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        env:
          BUMP_TYPE: ${{ inputs.bump }}
          EXPLICIT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if [[ -n "$EXPLICIT_TAG" ]]; then
            if [[ "$BUMP_TYPE" != "none" ]]; then
              echo "An explicit tag requires bump=none." >&2
              exit 1
            fi
            python3 .github/scripts/prepare_release.py --check-only \
              --expected-prerelease "$IS_PRERELEASE" "$EXPLICIT_TAG"
            echo "release-tag=$EXPLICIT_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "Prereleases require an explicit tag." >&2
            exit 1
          fi
          if [[ "$BUMP_TYPE" == "none" ]]; then
            echo "Provide an explicit tag or select a stable version bump." >&2
            exit 1
          fi

          release_tags="$(gh release list --exclude-drafts \
            --exclude-pre-releases --limit 1000 --json tagName \
            --jq '.[].tagName')"
          release_tag="$(printf '%s\n' "$release_tags" | \
            python3 .github/scripts/prepare_release.py --next-tag "$BUMP_TYPE")"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Validate release request
        env:
          IS_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.release-tag }}
        run: |
          python3 .github/scripts/prepare_release.py --check-only \
            --expected-prerelease "$IS_PRERELEASE" "$RELEASE_TAG"

      - name: Require unused tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.release-tag }}
        run: |
          set -euo pipefail

          set +e
          tag_output="$(git ls-remote --exit-code --tags origin \
            "refs/tags/$RELEASE_TAG" 2>&1)"
          tag_status=$?
          set -e
          case "$tag_status" in
            0)
              echo "Remote tag already exists: $RELEASE_TAG" >&2
              exit 1
              ;;
            2) ;;
            *)
              echo "Unable to verify whether remote tag exists:" >&2
              echo "$RELEASE_TAG" >&2
              printf '%s\n' "$tag_output" >&2
              exit 1
              ;;
          esac

          set +e
          release_output="$(gh api --include \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)"
          release_status=$?
          set -e
          if [[ "$release_status" -eq 0 ]]; then
            echo "GitHub release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          if ! printf '%s\n' "$release_output" | \
            grep -Eq '^HTTP/[0-9.]+ 404 '; then
            echo "Unable to verify whether GitHub release exists:" >&2
            echo "$RELEASE_TAG" >&2
            printf '%s\n' "$release_output" >&2
            exit 1
          fi

      - name: Create versioned release commit and annotated tag
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release-tag }}
        run: |
          set -euo pipefail

          python3 .github/scripts/prepare_release.py "$RELEASE_TAG"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/opnsense/manifest.json \
            custom_components/opnsense/const.py
          git commit -m "Release $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"

      - name: Build and test HACS archive from release tag
        env:
          RELEASE_ARCHIVE: ${{ runner.temp }}/opnsense.zip
          RELEASE_TAG: ${{ steps.release_tag.outputs.release-tag }}
        run: |
          set -euo pipefail

          git archive --format=zip --output="$RELEASE_ARCHIVE" \
            "$RELEASE_TAG:custom_components/opnsense"
          unzip -t "$RELEASE_ARCHIVE"

      - name: Push release tag
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.release-tag }}
        run: git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub release with HACS archive
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_ARCHIVE: ${{ runner.temp }}/opnsense.zip
          RELEASE_TAG: ${{ steps.release_tag.outputs.release-tag }}
        run: |
          set -euo pipefail

          OPNSENSE_LTD_FIRMWARE="$(grep 'OPNSENSE_LTD_FIRMWARE' \
            custom_components/opnsense/const.py | cut -d '"' -f2)"
          OPNSENSE_MIN_FIRMWARE="$(grep 'OPNSENSE_MIN_FIRMWARE' \
            custom_components/opnsense/const.py | cut -d '"' -f2)"
          firmware_notes="<h3>OPNsense Minimum Firmware Required: $OPNSENSE_MIN_FIRMWARE</h3><h4>OPNsense Recommended Firmware: $OPNSENSE_LTD_FIRMWARE+</h4><p><i>For firmware versions below the minimum version, the integration will not permit new installations and existing installations will no longer start. Firmware versions below the recommended version will likely work but may have limited features and/or show errors in the logs.</i></p>"
          release_asset="$RELEASE_ARCHIVE#opnsense.zip"
          arguments=(release create "$RELEASE_TAG" "$release_asset")
          arguments+=(--generate-notes --notes "$firmware_notes")
          arguments+=(--title "$RELEASE_TAG" --verify-tag)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            arguments+=(--prerelease)
          fi
          gh "${arguments[@]}"
