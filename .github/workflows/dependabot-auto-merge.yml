name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize-dependency-update:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted authorization helper
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Authorize dependency update files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          changed_files="${RUNNER_TEMP}/dependabot-changed-files"
          commits="${RUNNER_TEMP}/dependabot-commits.json"
          ancestry_proofs="${RUNNER_TEMP}/dependabot-ancestry-proofs.json"
          ancestry_proof_items="${RUNNER_TEMP}/dependabot-ancestry-proof-items.jsonl"
          gh api --paginate \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > "${changed_files}"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" \
            > "${commits}"
          : > "${ancestry_proof_items}"
          while IFS= read -r second_parent; do
            gh api "repos/${REPOSITORY}/compare/${second_parent}...${BASE_SHA}" |
              jq -c --arg parent_sha "${second_parent}" --arg base_sha "${BASE_SHA}" \
                '{parent_sha, base_sha, base_commit: .base_commit.sha, head_commit: .head_commit.sha, merge_base_commit: .merge_base_commit.sha, status, ahead_by, behind_by}' \
                >> "${ancestry_proof_items}"
          done < <(jq -r '.[].[] | select(.parents | length == 2) | .parents[1].sha' "${commits}")
          jq -s . "${ancestry_proof_items}" > "${ancestry_proofs}"
          node .github/scripts/dependabot-auto-merge.mjs \
            "${GITHUB_EVENT_PATH}" "${changed_files}" "${commits}" "${ancestry_proofs}"

  merge-validated-update:
    needs: authorize-dependency-update
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - name: Wait for validation and merge the authorized head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          # Deferred auto-merge can race this gate; use only a direct merge below.
          auto_merge_enabled="$(gh pr view "${PR_URL}" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [[ "${auto_merge_enabled}" == true ]]; then
            gh pr merge --disable-auto "${PR_URL}"
          fi
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            pr="$(gh pr view "${PR_URL}" --json state,headRefOid)"
            if ! jq -e --arg sha "${HEAD_SHA}" '.state == "OPEN" and .headRefOid == $sha' <<< "${pr}" > /dev/null; then
              echo "Pull request closed or authorized head changed; refusing to merge."
              exit 1
            fi
            checks_status=0
            checks="$(gh pr checks "${PR_URL}" --json name,workflow,bucket)" || checks_status=$?
            if (( checks_status != 0 && checks_status != 1 && checks_status != 8 )); then
              exit "${checks_status}"
            fi
            # Ignore this workflow's own pending merge job, but require every
            # validation to appear and pass, even without branch protection.
            validations="$(jq '[.[] | select(.workflow != "Dependabot auto-merge")]' <<< "${checks}")"
            if jq -e 'any(.[]; .bucket == "fail" or .bucket == "cancel")' <<< "${validations}" > /dev/null; then
              echo "A check failed or was cancelled; refusing to merge."
              jq '.[] | select(.bucket == "fail" or .bucket == "cancel")' <<< "${validations}"
              exit 1
            fi
            if jq -e '
              . as $checks |
              [
                ["HA and HACS Validate", "Hassfest Validation"],
                ["HA and HACS Validate", "HACS Validation"],
                ["Linters", "review"],
                ["Validate uv lock", "Validate uv lock consistency"],
                ["pytest check and post coverage", "pytest check and post coverage"],
                ["Lint PR title", "Validate PR title"]
              ] |
              all(.[]; . as $required |
                any($checks[]; [.workflow, .name] == $required and .bucket == "pass")) and
              all($checks[]; .bucket == "pass" or .bucket == "skipping")
            ' <<< "${validations}" > /dev/null; then
              gh pr merge --squash --match-head-commit "${HEAD_SHA}" "${PR_URL}"
              exit 0
            fi
            echo "Waiting for all validation checks to pass."
            sleep 20
          done
          echo "Timed out waiting for validation; refusing to merge."
          exit 1

  disable-auto-merge:
    if: >-
      failure() && !cancelled() &&
      github.event.repository.fork == false &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    needs: authorize-dependency-update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Disable an existing auto-merge request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          auto_merge_enabled="$(gh pr view "${PR_URL}" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [[ "${auto_merge_enabled}" == true ]]; then
            gh pr merge --disable-auto "${PR_URL}"
          else
            echo "Auto-merge is not enabled."
          fi
