name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize-dependency-update:
    if: >-
      github.event.repository.fork == false &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted authorization helper
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Authorize dependency update files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          changed_files="${RUNNER_TEMP}/dependabot-changed-files"
          commits="${RUNNER_TEMP}/dependabot-commits.json"
          gh api --paginate \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > "${changed_files}"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" \
            > "${commits}"
          node .github/scripts/dependabot-auto-merge.mjs \
            "${GITHUB_EVENT_PATH}" "${changed_files}" "${commits}"

  enable-auto-merge:
    needs: authorize-dependency-update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash --match-head-commit "${HEAD_SHA}" "${PR_URL}"

  disable-auto-merge:
    if: >-
      failure() && !cancelled() &&
      github.event.repository.fork == false &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    needs: authorize-dependency-update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Disable an existing auto-merge request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          auto_merge_enabled="$(gh pr view "${PR_URL}" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [[ "${auto_merge_enabled}" == true ]]; then
            gh pr merge --disable-auto "${PR_URL}"
          else
            echo "Auto-merge is not enabled."
          fi
